# Single service, no database. All config from the environment (Dokploy env or
# a local .env via `--env-file`). Dokploy: compose source = Git, composePath =
# docker/compose.yaml. The container always listens on 3002.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      API_PORT: "3002"
      HA_URL: ${HA_URL:?Set HA_URL}
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALIASES_FILE: ${ALIASES_FILE:-/data/aliases.json}
      CALIBRATIONS_FILE: ${CALIBRATIONS_FILE:-/data/calibrations.json}
    volumes:
      - aliases-data:/data

volumes:
  aliases-data:
